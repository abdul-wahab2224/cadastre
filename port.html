<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Interactive Parcel Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    // Default Wa coordinates
    let defaultLat = 10.0607;
    let defaultLng = -2.5019;
    let defaultZoom = 15;

    // Read from URL hash if present
    const params = new URLSearchParams(window.location.hash.replace('#', ''));
    const centerParam = params.get('center');
    const zoomParam = params.get('zoom');

    if (centerParam) {
      const [lat, lng] = centerParam.split(',').map(Number);
      if (!isNaN(lat) && !isNaN(lng)) {
        defaultLat = lat;
        defaultLng = lng;
      }
    }
    if (zoomParam && !isNaN(parseInt(zoomParam))) {
      defaultZoom = parseInt(zoomParam);
    }

    // Initialize map
    const map = L.map('map').setView([defaultLat, defaultLng], defaultZoom);

    // Tile layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Load parcel layer
    fetch('parcelpro.geojson')
      .then(res => res.json())
      .then(data => {
        L.geoJSON(data, {
          onEachFeature: function (feature, layer) {
            const props = feature.properties;
            let popup = "<strong>Plot No:</strong> " + (props.plot_number || "N/A");
            popup += "<br><strong>Owner:</strong> " + (props.owner_name || "N/A");
            popup += "<br><strong>UPRN:</strong> " + (props.uprn || "N/A");
            layer.bindPopup(popup);
          },
          style: {
            color: "#0059b3",
            weight: 1
          }
        }).addTo(map);
      });
  </script>
</body>
</html>
